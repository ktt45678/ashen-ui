@if (variant() === 'material') {
  <div
    class="sn-progress-bar-track sn-progress-bar-track--material"
    snPart="track"
    [class]="trackClassExtra()"
    role="progressbar"
    [attr.aria-valuenow]="ariaNow()"
    aria-valuemin="0"
    aria-valuemax="100"
  >
    <div class="sn-progress-bar-buffer"></div>
    <div
      class="sn-progress-bar-bar sn-progress-bar-bar--primary"
      snPart="fill"
      [class]="fillClassExtra()"
      [style.transform]="materialTransform()"
    >
      <span class="sn-progress-bar-bar-inner"></span>
    </div>
    @if (indeterminate()) {
      <div class="sn-progress-bar-bar sn-progress-bar-bar--secondary">
        <span class="sn-progress-bar-bar-inner"></span>
      </div>
    }
  </div>
} @else {
  <div
    class="sn-progress-bar-track"
    snPart="track"
    [class]="trackClassExtra()"
    role="progressbar"
    [attr.aria-valuenow]="ariaNow()"
    aria-valuemin="0"
    aria-valuemax="100"
  >
    @if (indeterminate()) {
      <div class="sn-progress-bar-fill sn-progress-bar-fill--indeterminate" snPart="fill" [class]="fillClassExtra()"></div>
    } @else {
      <div
        class="sn-progress-bar-fill"
        snPart="fill"
        [class]="fillClassExtra()"
        [style.width.%]="pct()"
      ></div>
    }
  </div>
}

@if (showLabel()) {
  <span class="sn-progress-bar-value" snPart="label" [class]="labelClassExtra()" aria-hidden="true">{{ displayValue() }}%</span>
}
