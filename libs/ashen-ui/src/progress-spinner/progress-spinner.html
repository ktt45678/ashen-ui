@if (variant() === 'material') {
  @if (isDeterminate()) {
    <svg
      viewBox="0 0 24 24"
      snPart="svg"
      class="sn-progress-spinner-material-determinate"
      [class]="svgClassExtra()"
      [attr.width]="size()"
      [attr.height]="size()"
      aria-hidden="true"
    >
      <circle
        class="sn-progress-spinner-material-circle"
        cx="12" cy="12"
        [attr.r]="materialRadius()"
        [attr.stroke]="fillColor()"
        [attr.stroke-width]="resolvedStrokeWidth()"
        [attr.stroke-dasharray]="materialCircumference()"
        [attr.stroke-dashoffset]="materialDashOffset()"
      />
    </svg>
  } @else {
    <div class="sn-progress-spinner-material" snPart="svg" [class]="svgClassExtra()" aria-hidden="true">
      <div class="sn-progress-spinner-material-layer">
        @for (segment of materialSegments; track segment) {
          <div [class]="'sn-progress-spinner-material-' + segment">
            <svg viewBox="0 0 24 24" class="sn-progress-spinner-material-arc">
              <circle
                class="sn-progress-spinner-material-circle"
                cx="12" cy="12"
                [attr.r]="materialRadius()"
                [attr.stroke]="fillColor()"
                [attr.stroke-width]="resolvedStrokeWidth()"
                [attr.stroke-dasharray]="materialCircumference()"
                [attr.stroke-dashoffset]="materialCircumference() / 2"
              />
            </svg>
          </div>
        }
      </div>
    </div>
  }
} @else {
  <svg
    viewBox="0 0 24 24"
    snPart="svg"
    [attr.width]="size()"
    [attr.height]="size()"
    [class]="svgClass() + ' ' + svgClassExtra()"
    [style.transform]="svgStyle()"
    aria-hidden="true"
  >
    <circle
      cx="12" cy="12" r="10"
      fill="none"
      stroke="var(--sn-progress-spinner-track-color)"
      [attr.stroke-width]="resolvedStrokeWidth()"
    />
    <circle
      cx="12" cy="12" r="10"
      fill="none"
      [attr.stroke]="fillColor()"
      [attr.stroke-width]="resolvedStrokeWidth()"
      stroke-linecap="round"
      [attr.stroke-dasharray]="fillDash()"
      [style.transition]="isDeterminate() ? 'stroke-dasharray var(--sn-motion-slow)' : null"
    />
  </svg>
}
