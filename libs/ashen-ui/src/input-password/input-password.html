<div class="sn-input-password-control">
  <input
    snPart="input"
    class="sn-input-text"
    [class.sn-input-text-sm]="size() === 'sm'"
    [class.sn-input-text-lg]="size() === 'lg'"
    [class.sn-input-text-error]="effectiveInvalid()"
    [class.sn-input-password-input]="true"
    [class]="inputClassExtra()"
    [type]="visible() ? 'text' : 'password'"
    [value]="value()"
    [placeholder]="effectivePlaceholder()"
    [disabled]="isDisabled()"
    [attr.id]="controlId()"
    [attr.aria-describedby]="ariaDescribedBy()"
    [attr.aria-invalid]="effectiveInvalid() ? 'true' : null"
    (input)="onInputChange($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
  />
  <button
    snButton
    variant="icon"
    color="none"
    size="sm"
    type="button"
    class="sn-input-password-toggle"
    [class]="toggleClassExtra()"
    [icon]="visible() ? 'visibility_off' : 'visibility'"
    [attr.aria-label]="toggleAriaLabel()"
    [disabled]="isDisabled()"
    (click)="toggleVisibility()"
  ></button>
</div>
@if (meter() && value()) {
  <div class="sn-input-password-meter" snPart="meter" [class]="meterClassExtra()">
    <div class="sn-input-password-meter-track">
      <div
        class="sn-input-password-meter-bar"
        snPart="meterBar"
        [class]="meterBarClassExtra()"
        [style.width.%]="strengthScore() / 4 * 100"
        [style.background]="strengthColor()"
      ></div>
    </div>
    <span class="sn-input-password-meter-label" snPart="meterLabel" [class]="meterLabelClassExtra()">{{ strengthLabel() }}</span>
  </div>
}
